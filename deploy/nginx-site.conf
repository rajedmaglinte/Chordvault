# ChordVault: __DOMAIN__ -> 127.0.0.1:__PORT__
# Certbot adds the HTTPS (443) block to this file when you run: sudo certbot --nginx -d __DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 30m;

    # Live leader sync: a long-lived stream, so no buffering and a long timeout.
    location /api/live/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
